name: Python CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.10
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server.txt pytest httpx "ruff[recommended]" black isort
      - name: Run formatting checks
        run: |
          black --check .
          isort --check-only .
      - name: Run lint
        run: |
          ruff check .
      - name: Run tests
        run: |
          pytest
