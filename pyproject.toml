[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | data
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
combine_as_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["E", "F", "W", "I", "C", "B", "Q", "SIM"]
lint.extend-ignore = ["E203", "E501"]
exclude = ["data", ".git", "__pycache__", ".venv", "build", "dist"]

[tool.ruff.lint.mccabe]
max-complexity = 20
